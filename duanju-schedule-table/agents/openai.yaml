interface:
  display_name: "剧本顺场表与分场表"
  short_description: "场内转场独立分行，原地点复用场号，生成顺场表与分场表 Excel"
  default_prompt: "Use $duanju-schedule-table to review the complete script, split true internal location changes into separate rows, retain the original scene number for the first space, assign a/b/c only to new spaces within that original scene, and reuse each space's number on return, classify named characters, special actors and background extras without asking for roster confirmation, and create one Excel workbook containing both script-order 顺场表 and location-grouped 分场表. Keep repeated scene numbers as distinct records with unique internal row IDs and review every segment independently; camera changes alone do not split a scene. Summarize each segment's concrete action or dialogue content from its complete source text, preserve uncertainty, and do not pad or truncate to a character count. Reuse the same scene data and only box reviewed continuous plot within one main location."
